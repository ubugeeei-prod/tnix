id = "tnix"
name = "tnix"
version = "0.5.0"
schema_version = 1
authors = ["tnix contributors"]
description = "tnix (typed Nix) syntax highlighting and tnix-lsp support"
repository = "https://github.com/ubugeeei/tnix"

[language_servers.tnix-lsp]
name = "tnix LSP"
# Attach to `.tnix` / `.d.tnix` (this extension) and to plain `.nix` buffers
# owned by Zed's Nix extension so existing Nix code gets ambient typing.
languages = ["tnix", "Nix"]

[language_servers.tnix-lsp.language_ids]
"tnix" = "tnix"
"Nix" = "nix"

# The grammar lives in this repository under editors/tree-sitter-tnix.
#
# NOTE: `rev` must point at a commit that contains editors/tree-sitter-tnix.
# Bump it to the merge commit of the change that introduced the grammar (and
# whenever grammar.js / src/parser.c change) before publishing the extension.
#
# For local development, point `repository` at your checkout instead:
#   repository = "file:///absolute/path/to/tnix"
# and set `rev` to a local commit sha that contains the grammar.
[grammars.tnix]
repository = "https://github.com/ubugeeei/tnix"
rev = "f1b622462608fa949a6b418b3e5af7db0caa767f"
path = "editors/tree-sitter-tnix"
