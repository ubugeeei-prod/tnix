name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-assets:
    name: Build Release Assets (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      attestations: write
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x64
            archive: tnix-${{ github.ref_name }}-linux-x64.tar.gz
            sha: tnix-${{ github.ref_name }}-linux-x64.sha256
          - os: macos-latest
            label: macos-arm64
            archive: tnix-${{ github.ref_name }}-macos-arm64.tar.gz
            sha: tnix-${{ github.ref_name }}-macos-arm64.sha256
    steps:
      - name: Check out sources
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Cabal dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            ~/.cabal/packages
            ~/.cabal/store
          key: ${{ runner.os }}-cabal-${{ hashFiles('cabal.project', 'packages/*/*.cabal') }}
          restore-keys: |
            ${{ runner.os }}-cabal-

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(nix develop --accept-flake-config --command pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install workspace dependencies
        run: nix develop --accept-flake-config --command pnpm install --frozen-lockfile

      - name: Prime the Cabal package index
        run: nix develop --accept-flake-config --command cabal update

      - name: Validate release metadata
        run: nix develop --accept-flake-config --command vp run check:versions

      - name: Build release binaries
        env:
          REF_NAME: ${{ github.ref_name }}
        run: nix develop --accept-flake-config --command node --experimental-strip-types ./scripts/package-release.ts "$REF_NAME" "${{ matrix.label }}" "${{ matrix.archive }}" "${{ matrix.sha }}"

      - name: Smoke test packaged binaries
        run: |
          set -euo pipefail
          stage_dir="$(mktemp -d)"
          tar -C "$stage_dir" -xzf "${{ matrix.archive }}"
          archive_root="$(find "$stage_dir" -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          "$archive_root/bin/tnix" --version
          "$archive_root/bin/tnix-lsp" --version

      - name: Verify release checksum
        run: nix develop --accept-flake-config --command node --experimental-strip-types ./scripts/package-release.ts verify-checksum "${{ matrix.sha }}"

      - name: Attest release archive and checksum
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4
        with:
          subject-path: |
            ${{ matrix.archive }}
            ${{ matrix.sha }}

      - name: Upload release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.label }}
          if-no-files-found: error
          path: |
            ./${{ matrix.archive }}
            ./${{ matrix.sha }}
          retention-days: 7

  build-vscode-extension:
    name: Build VS Code Extension
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      attestations: write
      contents: read
      id-token: write
    env:
      REF_NAME: ${{ github.ref_name }}
    steps:
      - name: Check out sources
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(nix develop --accept-flake-config --command pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install workspace dependencies
        run: nix develop --accept-flake-config --command pnpm install --frozen-lockfile

      - name: Validate release metadata
        run: nix develop --accept-flake-config --command vp run check:versions

      - name: Package VS Code extension
        run: |
          set -euo pipefail
          nix develop --accept-flake-config --command pnpm --filter tnix build
          nix develop --accept-flake-config --command pnpm --filter tnix exec vsce package --no-dependencies --out "../../tnix-vscode-$REF_NAME.vsix"

      - name: Attest VS Code extension
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4
        with:
          subject-path: ./tnix-vscode-${{ env.REF_NAME }}.vsix

      - name: Upload VS Code extension
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-vscode
          if-no-files-found: error
          path: ./tnix-vscode-${{ github.ref_name }}.vsix
          retention-days: 7

  publish-release:
    name: Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - build-assets
      - build-vscode-extension
    permissions:
      contents: write
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ./release-artifacts
          pattern: release-*
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: ./release-artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true

  publish-vscode-marketplaces:
    name: Publish VS Code Extension
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - build-vscode-extension
      - publish-release
    permissions:
      contents: read
    env:
      REF_NAME: ${{ github.ref_name }}
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - name: Check out sources
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(nix develop --accept-flake-config --command pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install workspace dependencies
        run: nix develop --accept-flake-config --command pnpm install --frozen-lockfile

      - name: Download VS Code extension
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-vscode
          path: ./release-vscode

      - name: Publish to VS Code Marketplace
        if: ${{ env.VSCE_PAT != '' }}
        run: nix develop --accept-flake-config --command pnpm --filter tnix exec vsce publish --packagePath "./release-vscode/tnix-vscode-$REF_NAME.vsix" --pat "$VSCE_PAT"

      - name: Publish to Open VSX
        if: ${{ env.OVSX_PAT != '' }}
        run: nix develop --accept-flake-config --command pnpm --filter tnix exec ovsx publish "./release-vscode/tnix-vscode-$REF_NAME.vsix" -p "$OVSX_PAT"

      - name: Skip marketplace publish
        if: ${{ env.VSCE_PAT == '' && env.OVSX_PAT == '' }}
        run: echo "No VSCE_PAT or OVSX_PAT secret configured; skipping marketplace publish."
