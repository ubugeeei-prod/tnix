name: Security

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "**/*.ts"
      - "editors/vscode/**"
      - ".github/workflows/security.yml"
  workflow_dispatch:
  schedule:
    # Weekly dependency-advisory sweep, independent of PR activity.
    - cron: "0 7 * * 1"

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  codeql:
    name: CodeQL (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Check out sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@03e4368ac7daa2bd82b3e85262f3bf87ee112f57 # v3
        with:
          languages: javascript-typescript

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@03e4368ac7daa2bd82b3e85262f3bf87ee112f57 # v3
        with:
          category: "/language:javascript-typescript"

  audit:
    name: Dependency audit
    # Scheduled / manual only: a new upstream advisory should not retroactively
    # fail unrelated pull requests.
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Audit Rust dependencies (cargo audit)
        run: nix shell nixpkgs#cargo-audit --accept-flake-config --command cargo-audit audit --file editors/zed/Cargo.lock

      - name: Audit Node dependencies (pnpm audit)
        run: nix develop --accept-flake-config --command pnpm audit --prod
