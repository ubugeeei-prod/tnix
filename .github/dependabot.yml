version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels:
      - "enhancement"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:30"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
    groups:
      vscode-tooling:
        patterns:
          - "@types/*"
          - "@vscode/*"
          - "typescript"
          - "esbuild"
          - "prettier"
          - "ovsx"
          - "vscode-languageclient"
    labels:
      - "enhancement"

  - package-ecosystem: "cargo"
    directory: "/editors/zed"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
    labels:
      - "enhancement"
