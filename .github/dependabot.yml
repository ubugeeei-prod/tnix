version: 2

# Automated dependency update PRs across the ecosystems used by tnix.
# Reviews are requested via CODEOWNERS, so reviewers are not duplicated here.
#
# The Haskell toolchain and nixpkgs are pinned by the Nix flake, which
# Dependabot cannot update. That surface is refreshed by the scheduled
# `.github/workflows/flake-update.yml` workflow (weekly `nix flake update` PR).
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: ci
      include: scope
    groups:
      gh-actions:
        patterns:
          - "*"

  # The pnpm workspace root, so updates to editors/vscode and deploy/docs also
  # regenerate the shared pnpm-lock.yaml (a package directory alone leaves the
  # lockfile stale and frozen installs fail).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - vscode
    commit-message:
      prefix: chore(deps)
      include: scope
    groups:
      npm-development:
        dependency-type: development
      npm-production:
        dependency-type: production
    ignore:
      # Must not exceed the extension's `engines.vscode`; it moves with an
      # intentional bump of the minimum supported VS Code version.
      - dependency-name: "@types/vscode"
        update-types:
          - version-update:semver-minor
          - version-update:semver-major

  - package-ecosystem: cargo
    directory: /editors/zed
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - zed
    commit-message:
      prefix: chore(deps)
      include: scope
